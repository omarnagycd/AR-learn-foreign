name: Publish teaching site
on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project-relative asset paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('public')
          names = [p.name for p in root.iterdir() if p.is_file()]
          prefixes = ['audio/', 'images/', 'fonts/', 'materials/'] + names
          for path in root.rglob('*'):
              if path.suffix in ('.html', '.css', '.js'):
                  text = path.read_text()
                  for prefix in prefixes:
                      text = text.replace('/' + prefix, './' + prefix)
                  path.write_text(text)
          (root / '.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
